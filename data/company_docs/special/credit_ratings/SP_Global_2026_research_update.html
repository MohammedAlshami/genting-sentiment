26lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID821\u0026quot;\u0026gt;Ratings List\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID1181\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;/ul\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;/ul\u0026gt;\u0026lt;div class=\u0026quot;clear\u0026quot;\u0026gt;\u0026lt;/div\u0026gt;\u0026lt;/div\u0026gt;\n      \u0026lt;a name=\u0026quot;ID105\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Rating Action Overview\u0026lt;/h4\u0026gt;\n        \u0026lt;ul\u0026gt;\n          \u0026lt;li\u0026gt;Genting's high capital expenditure (capex) and growth priorities could weaken its credit quality over the next two to three years. This is notwithstanding incremental earnings from a New York license.\u0026lt;/li\u0026gt;\n          \u0026lt;li\u0026gt;We anticipate the group's FFO-to-debt ratio could dip below 20% in 2026 and 2027 unless concrete and timely deleveraging measures are implemented. \u0026lt;/li\u0026gt;\n          \u0026lt;li\u0026gt;On Dec. 17, 2025, S\u0026amp;amp;P Global Ratings revised the outlooks on Genting Bhd., Genting Malaysia Bhd., Genting New York LLC, and Resorts World Las Vegas LLC to negative. We also affirmed the issuer and issue credit ratings on the entities. \u0026lt;/li\u0026gt;\n          \u0026lt;li\u0026gt;The negative outlook indicates that we could lower the ratings as spending could outpace incremental earnings growth, with FFO-to-debt ratio falling below 20% over the next two years.\u0026lt;/li\u0026gt;\n        \u0026lt;/ul\u0026gt;\n      \n      \u0026lt;a name=\u0026quot;ID125\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Rating Action Rationale \u0026lt;/h4\u0026gt;\n        \u0026lt;p\u0026gt;\u0026lt;span class=\u0026quot;subHead3\u0026quot;\u0026gt;Genting group's elevated spending and risk appetite over the next two to three years will test its credit quality.\u0026amp;nbsp;\u0026lt;/span\u0026gt;Several subsidiaries will undertake heavy investments over this period. These include Genting New York LLC's spending after it secured a full gaming New York license, Genting Singapore Ltd.\u0026rsquo;s Resorts World Sentosa expansion and Genting Energy Ltd.'s investments in a floating liquefied natural gas (FLNG) facility. This follows the parent Genting Bhd.'s Malaysian ringgit (MYR) 3.1 billion takeover bid for Genting Malaysia Bhd.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;We estimate the group's total capex in 2026 will be double the MYR6 billion in 2025, and much higher than the MYR4.3 billion in 2024. We expect capex to remain above MYR8 billion annually through 2030. \u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;Spending related to the New York license facility will on average account for close to 30% of the group's total annual capex over the next two to three years. The spending includes payments for the license fee, renovation of existing facilities, and building of new ones. The rejuvenation of Resorts World Sentosa, through 2030 along with investments in the FLNG facility in Indonesia until 2027, will all materially contribute to the group\u0026rsquo;s capex.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;Incremental earnings are unlikely to keep pace with spending. We estimate the average run-rate EBITDA from the New York license will exceed US$400 million (MYR1.8 billion) annually. Meanwhile, the FLNG facility is unlikely to generate cash flows until mid-2027 at the earliest. Earnings in Singapore should continue to recover following business disruptions at its brownfield facilities; however, the large investments will run down the company\u0026rsquo;s cash buffer. \u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;Given the high spending, we expect Genting Bhd.'s discretionary cash flow to remain negative over the next three years. This will cause the group's reported debt to rise toward MYR35 billion by 2028, from MYR21 billion in 2024. As such, Genting Bhd.'s leverage (ratio of funds from operations [FFO] to debt) could fall below 20% through 2027.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;\u0026lt;span class=\u0026quot;subHead3\u0026quot;\u0026gt;Genting Bhd.'s growth-centric approach is a deviation from our expectations for an investment grade credit profile.\u0026amp;nbsp;\u0026lt;/span\u0026gt;Such opportunistic behavior reduces predictability of the group's leverage, which could deteriorate due to event risks.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;In addition, Genting Bhd. lacks a clearly articulated financial policy. The group's increased risk appetite is seen in its unexpected debt-funded takeover bid for Genting Malaysia at a time where the rating headroom is narrowing.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;Any attempt by Genting Bhd. to privatize Genting Malaysia via additional debt to consolidate the U.S. assets could further delay a recovery in leverage, and the group will need to demonstrate its commitment to transparency and deleveraging.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;In the past, Genting Bhd.'s growth aspirations were seen in its bid for Japan's Yokohama Integrated Resort in 2019 and for a Macau gaming license in 2022. Although these investments ultimately did not materialize, they demonstrated the group's willingness to lever up even when the balance sheet was under pressure because of the acquisition and privatization of Empire Resorts Inc. in 2019, alongside expansion plans in Singapore and Resorts World Las Vegas, and later on, the pandemic. Such an approach materially weakened the group's credit quality, with Genting Bhd.'s FFO-to-debt ratio falling to 24% in 2022 from 78% in 2018.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;\u0026lt;span class=\u0026quot;subHead3\u0026quot;\u0026gt;Concrete deleveraging and refinancing plans for Genting Bhd. would be crucial, in our view.\u0026amp;nbsp;\u0026lt;/span\u0026gt;This will be particularly so if recovery at key subsidiaries in Singapore and Resorts World Las Vegas is slower than we expect. These subsidiaries historically contributed about 45% to the group's EBITDA.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;We expect Genting Bhd.'s dividends to reduce to below MYR1.5 billion annually through 2027, compared with MYR1.8 billion-MYR1.9 billion in 2023 and 2024. The company has not declared interim dividends for 2025. We understand that the group could also monetize non-core assets through the sale of its land at Miami.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;However, these alone may not be sufficient to sustainably improve the group's leverage. As such, we believe Genting Bhd. will need to devise other means to reduce its debt.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;In addition, the group subsidiaries face significant debt maturities in 2027. The maturities largely include US$1.5 billion of guaranteed notes at Genting Overseas Holdings Ltd., US$665 million of senior secured credit facilities at Resorts World Las Vegas, US$300 million debt at Empire Resorts, MYR1.1 billion at GENM Capital Bhd. and MYR400 million at Genting RMTN. We expect the group to refinance these maturities in a timely manner. \u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;\u0026lt;span class=\u0026quot;subHead3\u0026quot;\u0026gt;The New York license would deepen Genting Bhd.'s footprint in the U.S. and support the group's credit standing.\u0026amp;nbsp;\u0026lt;/span\u0026gt;We affirmed the rating on the group entities because we believe the New York license will enhance Genting Bhd.'s competitive position and expand its earnings potential.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;Genting Bhd. has a monopoly in the gaming market in downstate New York over the next three to four years. In our view, the area's dense population, high income levels, and significant tourist flow would support demand for Genting New York's casino. The casino's head start over Bally's Corp. and Metropolitan Park by at least four years would also enable Genting New York to continue to build its brand and garner customer loyalty.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;Unlike the lackluster performance at Resorts World Las Vegas and Empire Resorts, Genting New York's operations have been consistent. The New York subsidiary achieved nearly US$1 billion in annual gross gaming revenues in 2024 and 2023. \u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;\u0026lt;span class=\u0026quot;subHead3\u0026quot;\u0026gt;We expect continued recovery at Genting Bhd.'s other gaming operations.\u0026amp;nbsp;\u0026lt;/span\u0026gt;In Singapore, expansion of Resorts World Sentosa will help operating performance to gradually improve. Resorts World Las Vegas' volumes and margins could also see some uplift as operational rebuilding continues following a revamp to management and the hiring of new hosts in the first half of 2025.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;Genting Bhd.'s adjusted EBITDA for the third quarter ended Sept. 30, 2025 was about MYR2.2 billion, higher than the MYR2 billion on average in the previous two quarters. We attribute the improvement to higher \u0026quot;VIP\u0026quot; (or high roller) volumes, win rates, and visitations in the non-gaming segment in Singapore, and an uplift in gaming volume in Malaysia.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;\u0026lt;span class=\u0026quot;subHead3\u0026quot;\u0026gt;The ratings on Genting Malaysia, Resorts World Las Vegas, and Genting New York are tied to those on Genting Bhd.\u0026amp;nbsp;\u0026lt;/span\u0026gt;We continue to believe the parent will provide strong long-term support to these group companies, even under stressed conditions. This is mainly due to their strategic importance to the group's branding (\u0026quot;Resorts World\u0026quot; and \u0026quot;Genting\u0026quot;), and operations.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;We assess Genting Malaysia to be a core subsidiary of Genting Bhd. because we believe it is integral to the group's business and strategy. We assess Resorts World Las Vegas and Genting New York as highly strategic subsidiaries owing to their strategic importance to the group's expansion strategy in the U.S. Resorts World Las Vegas and Genting New York's less significant EBITDA contribution to the group limit their group status when compared with Genting Malaysia.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;However, we believe Resorts World Las Vegas and Genting New York' will receive support under almost all foreseeable circumstances because any financial distress in these companies will have significant implications for Genting group's reputation and global standing with gaming regulators.\u0026lt;/p\u0026gt;\n      \n      \u0026lt;a name=\u0026quot;ID218\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Outlook\u0026lt;/h4\u0026gt;\n        \u0026lt;p\u0026gt;The negative rating outlook on Genting Bhd. reflects our expectation that the group's credit quality could weaken over the next two years due to higher capital spending and growth appetite. Spending could outpace incremental earnings, with the FFO-to-debt ratio falling below 20% over the period.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;The negative rating outlooks on Genting Malaysia, Resorts World Las Vegas, and Genting New York reflect that on Genting Bhd.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;\u0026lt;/p\u0026gt;\n        \u0026lt;a name=\u0026quot;ID231\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h5\u0026gt;Downside scenario\u0026lt;/h5\u0026gt;\n          \u0026lt;p\u0026gt;We may lower the ratings on Genting Bhd. if the group's financial profile deteriorates, such that its FFO-to-debt ratio remains below 20% for a sustained period. This could happen if: (1) Genting Bhd. fully privatizes Genting Malaysia largely via debt; (2) earnings from the New York gaming license are weaker than we expect; or (3) investment cycles, such as the FLNG project, are higher than we expect.\u0026lt;/p\u0026gt;\n          \u0026lt;p\u0026gt;We may lower the ratings on Genting Malaysia, Resorts World Las Vegas, and Genting New York if we downgrade its parent. We could also lower the ratings on the group companies if we see a lower likelihood of support from the parent.\u0026lt;/p\u0026gt;\n          \u0026lt;p\u0026gt;\u0026lt;/p\u0026gt;\n          \u0026lt;p\u0026gt;We may lower our assessment of Genting Malaysia's stand-alone credit profile (SACP) if the company's FFO-to-debt ratio falls below 12%. This could happen if: (1) earnings from the New York license are weaker than we expect; (2) Genting Malaysia pursues aggressive debt-funded capex; or (3) Genting Malaysia's market position deteriorates. \u0026lt;/p\u0026gt;\n        \n        \u0026lt;a name=\u0026quot;ID246\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h5\u0026gt;Upside scenario\u0026lt;/h5\u0026gt;\n          \u0026lt;p\u0026gt;We may revise the outlook on Genting Bhd. to stable if the group demonstrates financial prudence and discipline through its elevated investment phase such that the FFO-to-debt ratio stays above 20%. We could also do so if the group has a stronger-than-expected performance from its New York license.\u0026lt;/p\u0026gt;\n          \u0026lt;p\u0026gt;We will revise the outlooks on Genting Malaysia, Resorts World Las Vegas, and Genting New York if we do the same for the parent.\u0026lt;/p\u0026gt;\n        \n      \n      \u0026lt;a name=\u0026quot;ID257\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Company Description\u0026lt;/h4\u0026gt;\n        \u0026lt;p\u0026gt;Genting Bhd. is the parent of the Genting group. The leisure and hospitality sector contributes about 85% of the group's EBITDA. The group's two key assets are Resorts World Genting, the sole gaming operator in Malaysia, and Resorts World Sentosa, one of two gaming operators in Singapore's duopoly market.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;The group launched the Resorts World Las Vegas integrated resort in Las Vegas in June 2021 and acquired a 49% stake in Empire Resorts in 2019, which it now fully owns. It also owns Genting New York through Genting Malaysia. Besides gaming, the group has exposure to plantations, the energy industry, and other investments.\u0026lt;/p\u0026gt;\n      \n      \u0026lt;a name=\u0026quot;ID267\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Liquidity\u0026lt;/h4\u0026gt;\n        \u0026lt;p\u0026gt;We revised our liquidity assessments on Genting Bhd. and Genting Malaysia to adequate from strong due to large maturities falling in 2027. Nonetheless, we estimate both entities' liquidity sources will be more than 1.2x uses in the 12 months ending Sept. 30, 2026.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;We believe Genting Bhd. and Genting Malaysia's net sources of liquidity will remain positive over the 12 months ending Sept. 30, 2026, even if EBITDA declines by 15% from our base case. \u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;Both entities' established and solid relationships with lenders and high credit standing support their liquidity. This is reflected in Genting Bhd.'s good market capitalization in equity markets and record of debt issuances under various group companies, including Genting Malaysia, Genting New York, and Resorts World Las Vegas. \u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;Genting Malaysia maintains diversified funding instruments with major banks, among others Citibank, JP Morgan, Mizuho, and domestically, AmInvestment Bank. In addition, the company has domestic and global bond issuances over the past several years, demonstrating its good access to financial markets.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;We expect Genting Bhd. and Genting Malaysia to be able to absorb high impact, low probability events with limited need for refinancing given their large cash balances.\u0026lt;/p\u0026gt;\n      \n      \u0026lt;a name=\u0026quot;ID286\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;\u0026lt;/h4\u0026gt;\n        \u0026lt;a name=\u0026quot;ID291\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;div class=\u0026quot;sideBar \u0026quot;\u0026gt;\u0026lt;div class=\u0026quot;colWrapper\u0026quot;\u0026gt;\u0026lt;div class=\u0026quot;header\u0026quot;\u0026gt;\u0026lt;div class=\u0026quot;left\u0026quot;\u0026gt;\u0026lt;h1\u0026gt;Principal liquidity sources\u0026lt;/h1\u0026gt;\u0026lt;/div\u0026gt;\u0026lt;div class=\u0026quot;right\u0026quot;\u0026gt;\u0026lt;h1\u0026gt;Principal liquidity uses\u0026lt;/h1\u0026gt;\u0026lt;/div\u0026gt;\u0026lt;/div\u0026gt;\u0026lt;div class=\u0026quot;left\u0026quot;\u0026gt;\u0026lt;div class=\u0026quot;sideBarBody\u0026quot;\u0026gt;\n          \u0026lt;p\u0026gt;\u0026lt;span class=\u0026quot;subHead3\u0026quot;\u0026gt;Genting Bhd.\u0026amp;nbsp;\u0026lt;/span\u0026gt;\u0026lt;/p\u0026gt;\n          \u0026lt;ul\u0026gt;\n            \u0026lt;li\u0026gt;Cash and cash equivalent of close to MYR20 billion as of Sept. 30, 2025. \u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;Annual cash flow from operations of MYR6.0 billion-MYR6.5 billion over the 12 months ending Sept. 30, 2026. \u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;Issuance of MYR3 billion of domestic medium-term notes by December 2025, primarily to fund Genting Malaysia's takeover offer. \u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;Proceeds from delayed draw term loan (DDTL) of US$775 million, and a revolving credit facility (RCF) of US$150 million to fund phase 1 of the New York license; of which DDTL is likely to be drawn in January 2026. \u0026lt;/li\u0026gt;\n          \u0026lt;/ul\u0026gt;\n          \u0026lt;p\u0026gt;\u0026lt;/p\u0026gt;\n          \u0026lt;p\u0026gt;\u0026lt;span class=\u0026quot;subHead3\u0026quot;\u0026gt;Genting Malaysia\u0026amp;nbsp;\u0026lt;/span\u0026gt;\u0026lt;/p\u0026gt;\n          \u0026lt;ul\u0026gt;\n            \u0026lt;li\u0026gt;Cash and cash equivalents of about MYR3.4 billion as of Sept. 30, 2025. \u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;Proceeds from DDTL of US$775 million, and RCF of US$150 million to fund phase 1 of the New York license; of which DDTL is likely to be drawn in January 2026.\u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;Cash flow from operations of about MYR2.9 billion--MYR3 billion for the 12 months ending Sept. 30, 2026. \u0026lt;/li\u0026gt;\n          \u0026lt;/ul\u0026gt;\n        \u0026lt;/div\u0026gt;\u0026lt;/div\u0026gt;\u0026lt;div class=\u0026quot;right\u0026quot;\u0026gt;\u0026lt;div class=\u0026quot;sideBarBody\u0026quot;\u0026gt;\n          \u0026lt;p\u0026gt;\u0026lt;/p\u0026gt;\n          \u0026lt;p\u0026gt;\u0026lt;span class=\u0026quot;subHead3\u0026quot;\u0026gt;Genting Bhd.\u0026amp;nbsp;\u0026lt;/span\u0026gt;\u0026lt;/p\u0026gt;\n          \u0026lt;ul\u0026gt;\n            \u0026lt;li\u0026gt;Debt maturities of about MYR2.7 billion over the 12 months ending Sept. 30, 2026. \u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;Annual committed capex of MYR9 billion-MYR10 billion over the 12 months ending Sept. 30, 2026. \u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;Annual dividend payments of below MYR1.5 billion during the same period. \u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;MYR3.1 billion incurred as part of the Genting Malaysia takeover offer in December 2025.\u0026lt;/li\u0026gt;\n          \u0026lt;/ul\u0026gt;\n          \u0026lt;p\u0026gt;\u0026lt;/p\u0026gt;\n          \u0026lt;p\u0026gt;\u0026lt;/p\u0026gt;\n          \u0026lt;p\u0026gt;\u0026lt;/p\u0026gt;\n          \u0026lt;p\u0026gt;\u0026lt;/p\u0026gt;\n          \u0026lt;p\u0026gt;\u0026lt;span class=\u0026quot;subHead3\u0026quot;\u0026gt;Genting Malaysia\u0026amp;nbsp;\u0026lt;/span\u0026gt;\u0026lt;/p\u0026gt;\n          \u0026lt;ul\u0026gt;\n            \u0026lt;li\u0026gt;Debt maturities of close to MYR0.3 billion over the 12 months ending Sept. 30, 2026. \u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;Capex of about MYR4.6 billion over the 12 months ending Sept. 30, 2026. \u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;Annual dividend payments of MYR0.6 billion-MYR0.7 billion over the 12 months ending Sept. 30, 2026.\u0026lt;/li\u0026gt;\n          \u0026lt;/ul\u0026gt;\n          \u0026lt;p\u0026gt;\u0026lt;/p\u0026gt;\n        \u0026lt;/div\u0026gt;\u0026lt;/div\u0026gt;\u0026lt;/div\u0026gt;\u0026lt;/div\u0026gt;\n        \n      \n      \u0026lt;a name=\u0026quot;ID394\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Rating Component Scores\u0026lt;/h4\u0026gt;\n        \u0026lt;p\u0026gt;\u0026lt;/p\u0026gt;\n        \u0026lt;h4 class=\u0026quot;tableHeader\u0026quot;\u0026gt;\u0026lt;/h4\u0026gt;\u0026lt;table border=\u0026quot;0\u0026quot; cellspacing=\u0026quot;0\u0026quot; cellpadding=\u0026quot;0\u0026quot; class=\u0026quot;article \u0026quot;\u0026gt;\n          \u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n            \u0026lt;th class=\u0026quot;tableTitle\u0026quot; colspan=\u0026quot;3\u0026quot;\u0026gt;Rating Component Scores\u0026lt;/th\u0026gt;\n            \n            \n          \u0026lt;/tr\u0026gt;\n          \u0026lt;tr class=\u0026quot;rowDefault\u0026quot;\u0026gt;\n            \u0026lt;td class=\u0026quot;TableText\u0026quot;\u0026gt;\u0026lt;/td\u0026gt;\n            \u0026lt;th\u0026gt;Genting Bhd.\u0026lt;/th\u0026gt a href=\u0026quot;#ID105\u0026quot;\u0026gt;Rating Action Overview\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID125\u0026quot;\u0026gt;Rating Action Rationale \u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID218\u0026quot;\u0026gt;Outlook\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID257\u0026quot;\u0026gt;Company Description\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID267\u0026quot;\u0026gt;Liquidity\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID286\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID394\u0026quot;\u0026gt;Rating Component Scores\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID643\u0026quot;\u0026gt;Related Criteria\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID793\u0026quot;\u0026gt;Related Research\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID821\u0026quot;\u0026gt;Ratings List\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;li\u0026gt;\u0026lt;a href=\u0026quot;#ID1181\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;/ul\u0026gt;\u0026lt;/li\u0026gt;\u0026lt;/ul\u0026gt;\u0026lt;div class=\u0026quot;clear\u0026quot;\u0026gt;\u0026lt;/div\u0026gt;\u0026lt;/div\u0026gt;\n      \u0026lt;a name=\u0026quot;ID105\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Rating Action Overview\u0026lt;/h4\u0026gt;\n        \u0026lt;ul\u0026gt;\n          \u0026lt;li\u0026gt;Genting's high capital expenditure (capex) and growth priorities could weaken its credit quality over the next two to three years. This is notwithstanding incremental earnings from a New York license.\u0026lt;/li\u0026gt;\n          \u0026lt;li\u0026gt;We anticipate the group's FFO-to-debt ratio could dip below 20% in 2026 and 2027 unless concrete and timely deleveraging measures are implemented. \u0026lt;/li\u0026gt;\n          \u0026lt;li\u0026gt;On Dec. 17, 2025, S\u0026amp;amp;P Global Ratings revised the outlooks on Genting Bhd., Genting Malaysia Bhd., Genting New York LLC, and Resorts World Las Vegas LLC to negative. We also affirmed the issuer and issue credit ratings on the entities. \u0026lt;/li\u0026gt;\n          \u0026lt;li\u0026gt;The negative outlook indicates that we could lower the ratings as spending could outpace incremental earnings growth, with FFO-to-debt ratio falling below 20% over the next two years.\u0026lt;/li\u0026gt;\n        \u0026lt;/ul\u0026gt;\n      \n      \u0026lt;a name=\u0026quot;ID125\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Rating Action Rationale \u0026lt;/h4\u0026gt;\n        \u0026lt;p\u0026gt;\u0026lt;span class=\u0026quot;subHead3\u0026quot;\u0026gt;Genting group's elevated spending and risk appetite over the next two to three years will test its credit quality.\u0026amp;nbsp;\u0026lt;/span\u0026gt;Several subsidiaries will undertake heavy investments over this period. These include Genting New York LLC's spending after it secured a full gaming New York license, Genting Singapore Ltd.\u0026rsquo;s Resorts World Sentosa expansion and Genting Energy Ltd.'s investments in a floating liquefied natural gas (FLNG) facility. This follows the parent Genting Bhd.'s Malaysian ringgit (MYR) 3.1 billion takeover bid for Genting Malaysia Bhd.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;We estimate the group's total capex in 2026 will be double the MYR6 billion in 2025, and much higher than the MYR4.3 billion in 2024. We expect capex to remain above MYR8 billion annually through 2030. \u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;Spending related to the New York license facility will on average account for close to 30% of the group's total annual capex over the next two to three years. The spending includes payments for the license fee, renovation of existing facilities, and building of new ones. The rejuvenation of Resorts World Sentosa, through 2030 along with investments in the FLNG facility in Indonesia until 2027, will all materially contribute to the group\u0026rsquo;s capex.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;Incremental earnings are unlikely to keep pace with spending. We estimate the average run-rate EBITDA from the New York license will exceed US$400 million (MYR1.8 billion) annually. Meanwhile, the FLNG facility is unlikely to generate cash flows until mid-2027 at the earliest. Earnings in Singapore should continue to recover following business disruptions at its brownfield facilities; however, the large investments will run down the company\u0026rsquo;s cash buffer. \u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;Given the high spending, we expect Genting Bhd.'s discretionary cash flow to remain negative over the next three years. This will cause the group's reported debt to rise toward MYR35 billion by 2028, from MYR21 billion in 2024. As such, Genting Bhd.'s leverage (ratio of funds from operations [FFO] to debt) could fall below 20% through 2027.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;\u0026lt;span class=\u0026quot;subHead3\u0026quot;\u0026gt;Genting Bhd.'s growth-centric approach is a deviation from our expectations for an investment grade credit profile.\u0026amp;nbsp;\u0026lt;/span\u0026gt;Such opportunistic behavior reduces predictability of the group's leverage, which could deteriorate due to event risks.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;In addition, Genting Bhd. lacks a clearly articulated financial policy. The group's increased risk appetite is seen in its unexpected debt-funded takeover bid for Genting Malaysia at a time where the rating headroom is narrowing.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;Any attempt by Genting Bhd. to privatize Genting Malaysia via additional debt to consolidate the U.S. assets could further delay a recovery in leverage, and the group will need to demonstrate its commitment to transparency and deleveraging.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;In the past, Genting Bhd.'s growth aspirations were seen in its bid for Japan's Yokohama Integrated Resort in 2019 and for a Macau gaming license in 2022. Although these investments ultimately did not materialize, they demonstrated the group's willingness to lever up even when the balance sheet was under pressure because of the acquisition and privatization of Empire Resorts Inc. in 2019, alongside expansion plans in Singapore and Resorts World Las Vegas, and later on, the pandemic. Such an approach materially weakened the group's credit quality, with Genting Bhd.'s FFO-to-debt ratio falling to 24% in 2022 from 78% in 2018.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;\u0026lt;span class=\u0026quot;subHead3\u0026quot;\u0026gt;Concrete deleveraging and refinancing plans for Genting Bhd. would be crucial, in our view.\u0026amp;nbsp;\u0026lt;/span\u0026gt;This will be particularly so if recovery at key subsidiaries in Singapore and Resorts World Las Vegas is slower than we expect. These subsidiaries historically contributed about 45% to the group's EBITDA.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;We expect Genting Bhd.'s dividends to reduce to below MYR1.5 billion annually through 2027, compared with MYR1.8 billion-MYR1.9 billion in 2023 and 2024. The company has not declared interim dividends for 2025. We understand that the group could also monetize non-core assets through the sale of its land at Miami.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;However, these alone may not be sufficient to sustainably improve the group's leverage. As such, we believe Genting Bhd. will need to devise other means to reduce its debt.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;In addition, the group subsidiaries face significant debt maturities in 2027. The maturities largely include US$1.5 billion of guaranteed notes at Genting Overseas Holdings Ltd., US$665 million of senior secured credit facilities at Resorts World Las Vegas, US$300 million debt at Empire Resorts, MYR1.1 billion at GENM Capital Bhd. and MYR400 million at Genting RMTN. We expect the group to refinance these maturities in a timely manner. \u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;\u0026lt;span class=\u0026quot;subHead3\u0026quot;\u0026gt;The New York license would deepen Genting Bhd.'s footprint in the U.S. and support the group's credit standing.\u0026amp;nbsp;\u0026lt;/span\u0026gt;We affirmed the rating on the group entities because we believe the New York license will enhance Genting Bhd.'s competitive position and expand its earnings potential.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;Genting Bhd. has a monopoly in the gaming market in downstate New York over the next three to four years. In our view, the area's dense population, high income levels, and significant tourist flow would support demand for Genting New York's casino. The casino's head start over Bally's Corp. and Metropolitan Park by at least four years would also enable Genting New York to continue to build its brand and garner customer loyalty.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;Unlike the lackluster performance at Resorts World Las Vegas and Empire Resorts, Genting New York's operations have been consistent. The New York subsidiary achieved nearly US$1 billion in annual gross gaming revenues in 2024 and 2023. \u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;\u0026lt;span class=\u0026quot;subHead3\u0026quot;\u0026gt;We expect continued recovery at Genting Bhd.'s other gaming operations.\u0026amp;nbsp;\u0026lt;/span\u0026gt;In Singapore, expansion of Resorts World Sentosa will help operating performance to gradually improve. Resorts World Las Vegas' volumes and margins could also see some uplift as operational rebuilding continues following a revamp to management and the hiring of new hosts in the first half of 2025.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;Genting Bhd.'s adjusted EBITDA for the third quarter ended Sept. 30, 2025 was about MYR2.2 billion, higher than the MYR2 billion on average in the previous two quarters. We attribute the improvement to higher \u0026quot;VIP\u0026quot; (or high roller) volumes, win rates, and visitations in the non-gaming segment in Singapore, and an uplift in gaming volume in Malaysia.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;\u0026lt;span class=\u0026quot;subHead3\u0026quot;\u0026gt;The ratings on Genting Malaysia, Resorts World Las Vegas, and Genting New York are tied to those on Genting Bhd.\u0026amp;nbsp;\u0026lt;/span\u0026gt;We continue to believe the parent will provide strong long-term support to these group companies, even under stressed conditions. This is mainly due to their strategic importance to the group's branding (\u0026quot;Resorts World\u0026quot; and \u0026quot;Genting\u0026quot;), and operations.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;We assess Genting Malaysia to be a core subsidiary of Genting Bhd. because we believe it is integral to the group's business and strategy. We assess Resorts World Las Vegas and Genting New York as highly strategic subsidiaries owing to their strategic importance to the group's expansion strategy in the U.S. Resorts World Las Vegas and Genting New York's less significant EBITDA contribution to the group limit their group status when compared with Genting Malaysia.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;However, we believe Resorts World Las Vegas and Genting New York' will receive support under almost all foreseeable circumstances because any financial distress in these companies will have significant implications for Genting group's reputation and global standing with gaming regulators.\u0026lt;/p\u0026gt;\n      \n      \u0026lt;a name=\u0026quot;ID218\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Outlook\u0026lt;/h4\u0026gt;\n        \u0026lt;p\u0026gt;The negative rating outlook on Genting Bhd. reflects our expectation that the group's credit quality could weaken over the next two years due to higher capital spending and growth appetite. Spending could outpace incremental earnings, with the FFO-to-debt ratio falling below 20% over the period.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;The negative rating outlooks on Genting Malaysia, Resorts World Las Vegas, and Genting New York reflect that on Genting Bhd.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;\u0026lt;/p\u0026gt;\n        \u0026lt;a name=\u0026quot;ID231\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h5\u0026gt;Downside scenario\u0026lt;/h5\u0026gt;\n          \u0026lt;p\u0026gt;We may lower the ratings on Genting Bhd. if the group's financial profile deteriorates, such that its FFO-to-debt ratio remains below 20% for a sustained period. This could happen if: (1) Genting Bhd. fully privatizes Genting Malaysia largely via debt; (2) earnings from the New York gaming license are weaker than we expect; or (3) investment cycles, such as the FLNG project, are higher than we expect.\u0026lt;/p\u0026gt;\n          \u0026lt;p\u0026gt;We may lower the ratings on Genting Malaysia, Resorts World Las Vegas, and Genting New York if we downgrade its parent. We could also lower the ratings on the group companies if we see a lower likelihood of support from the parent.\u0026lt;/p\u0026gt;\n          \u0026lt;p\u0026gt;\u0026lt;/p\u0026gt;\n          \u0026lt;p\u0026gt;We may lower our assessment of Genting Malaysia's stand-alone credit profile (SACP) if the company's FFO-to-debt ratio falls below 12%. This could happen if: (1) earnings from the New York license are weaker than we expect; (2) Genting Malaysia pursues aggressive debt-funded capex; or (3) Genting Malaysia's market position deteriorates. \u0026lt;/p\u0026gt;\n        \n        \u0026lt;a name=\u0026quot;ID246\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h5\u0026gt;Upside scenario\u0026lt;/h5\u0026gt;\n          \u0026lt;p\u0026gt;We may revise the outlook on Genting Bhd. to stable if the group demonstrates financial prudence and discipline through its elevated investment phase such that the FFO-to-debt ratio stays above 20%. We could also do so if the group has a stronger-than-expected performance from its New York license.\u0026lt;/p\u0026gt;\n          \u0026lt;p\u0026gt;We will revise the outlooks on Genting Malaysia, Resorts World Las Vegas, and Genting New York if we do the same for the parent.\u0026lt;/p\u0026gt;\n        \n      \n      \u0026lt;a name=\u0026quot;ID257\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Company Description\u0026lt;/h4\u0026gt;\n        \u0026lt;p\u0026gt;Genting Bhd. is the parent of the Genting group. The leisure and hospitality sector contributes about 85% of the group's EBITDA. The group's two key assets are Resorts World Genting, the sole gaming operator in Malaysia, and Resorts World Sentosa, one of two gaming operators in Singapore's duopoly market.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;The group launched the Resorts World Las Vegas integrated resort in Las Vegas in June 2021 and acquired a 49% stake in Empire Resorts in 2019, which it now fully owns. It also owns Genting New York through Genting Malaysia. Besides gaming, the group has exposure to plantations, the energy industry, and other investments.\u0026lt;/p\u0026gt;\n      \n      \u0026lt;a name=\u0026quot;ID267\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;Liquidity\u0026lt;/h4\u0026gt;\n        \u0026lt;p\u0026gt;We revised our liquidity assessments on Genting Bhd. and Genting Malaysia to adequate from strong due to large maturities falling in 2027. Nonetheless, we estimate both entities' liquidity sources will be more than 1.2x uses in the 12 months ending Sept. 30, 2026.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;We believe Genting Bhd. and Genting Malaysia's net sources of liquidity will remain positive over the 12 months ending Sept. 30, 2026, even if EBITDA declines by 15% from our base case. \u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;Both entities' established and solid relationships with lenders and high credit standing support their liquidity. This is reflected in Genting Bhd.'s good market capitalization in equity markets and record of debt issuances under various group companies, including Genting Malaysia, Genting New York, and Resorts World Las Vegas. \u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;Genting Malaysia maintains diversified funding instruments with major banks, among others Citibank, JP Morgan, Mizuho, and domestically, AmInvestment Bank. In addition, the company has domestic and global bond issuances over the past several years, demonstrating its good access to financial markets.\u0026lt;/p\u0026gt;\n        \u0026lt;p\u0026gt;We expect Genting Bhd. and Genting Malaysia to be able to absorb high impact, low probability events with limited need for refinancing given their large cash balances.\u0026lt;/p\u0026gt;\n      \n      \u0026lt;a name=\u0026quot;ID286\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;h4 class=\u0026quot;\u0026quot;\u0026gt;\u0026lt;/h4\u0026gt;\n        \u0026lt;a name=\u0026quot;ID291\u0026quot;\u0026gt;\u0026lt;/a\u0026gt;\u0026lt;div class=\u0026quot;sideBar \u0026quot;\u0026gt;\u0026lt;div class=\u0026quot;colWrapper\u0026quot;\u0026gt;\u0026lt;div class=\u0026quot;header\u0026quot;\u0026gt;\u0026lt;div class=\u0026quot;left\u0026quot;\u0026gt;\u0026lt;h1\u0026gt;Principal liquidity sources\u0026lt;/h1\u0026gt;\u0026lt;/div\u0026gt;\u0026lt;div class=\u0026quot;right\u0026quot;\u0026gt;\u0026lt;h1\u0026gt;Principal liquidity uses\u0026lt;/h1\u0026gt;\u0026lt;/div\u0026gt;\u0026lt;/div\u0026gt;\u0026lt;div class=\u0026quot;left\u0026quot;\u0026gt;\u0026lt;div class=\u0026quot;sideBarBody\u0026quot;\u0026gt;\n          \u0026lt;p\u0026gt;\u0026lt;span class=\u0026quot;subHead3\u0026quot;\u0026gt;Genting Bhd.\u0026amp;nbsp;\u0026lt;/span\u0026gt;\u0026lt;/p\u0026gt;\n          \u0026lt;ul\u0026gt;\n            \u0026lt;li\u0026gt;Cash and cash equivalent of close to MYR20 billion as of Sept. 30, 2025. \u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;Annual cash flow from operations of MYR6.0 billion-MYR6.5 billion over the 12 months ending Sept. 30, 2026. \u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;Issuance of MYR3 billion of domestic medium-term notes by December 2025, primarily to fund Genting Malaysia's takeover offer. \u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;Proceeds from delayed draw term loan (DDTL) of US$775 million, and a revolving credit facility (RCF) of US$150 million to fund phase 1 of the New York license; of which DDTL is likely to be drawn in January 2026. \u0026lt;/li\u0026gt;\n          \u0026lt;/ul\u0026gt;\n          \u0026lt;p\u0026gt;\u0026lt;/p\u0026gt;\n          \u0026lt;p\u0026gt;\u0026lt;span class=\u0026quot;subHead3\u0026quot;\u0026gt;Genting Malaysia\u0026amp;nbsp;\u0026lt;/span\u0026gt;\u0026lt;/p\u0026gt;\n          \u0026lt;ul\u0026gt;\n            \u0026lt;li\u0026gt;Cash and cash equivalents of about MYR3.4 billion as of Sept. 30, 2025. \u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;Proceeds from DDTL of US$775 million, and RCF of US$150 million to fund phase 1 of the New York license; of which DDTL is likely to be drawn in January 2026.\u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;Cash flow from operations of about MYR2.9 billion--MYR3 billion for the 12 months ending Sept. 30, 2026. \u0026lt;/li\u0026gt;\n          \u0026lt;/ul\u0026gt;\n        \u0026lt;/div\u0026gt;\u0026lt;/div\u0026gt;\u0026lt;div class=\u0026quot;right\u0026quot;\u0026gt;\u0026lt;div class=\u0026quot;sideBarBody\u0026quot;\u0026gt;\n          \u0026lt;p\u0026gt;\u0026lt;/p\u0026gt;\n          \u0026lt;p\u0026gt;\u0026lt;span class=\u0026quot;subHead3\u0026quot;\u0026gt;Genting Bhd.\u0026amp;nbsp;\u0026lt;/span\u0026gt;\u0026lt;/p\u0026gt;\n          \u0026lt;ul\u0026gt;\n            \u0026lt;li\u0026gt;Debt maturities of about MYR2.7 billion over the 12 months ending Sept. 30, 2026. \u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;Annual committed capex of MYR9 billion-MYR10 billion over the 12 months ending Sept. 30, 2026. \u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;Annual dividend payments of below MYR1.5 billion during the same period. \u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;MYR3.1 billion incurred as part of the Genting Malaysia takeover offer in December 2025.\u0026lt;/li\u0026gt;\n          \u0026lt;/ul\u0026gt;\n          \u0026lt;p\u0026gt;\u0026lt;/p\u0026gt;\n          \u0026lt;p\u0026gt;\u0026lt;/p\u0026gt;\n          \u0026lt;p\u0026gt;\u0026lt;/p\u0026gt;\n          \u0026lt;p\u0026gt;\u0026lt;/p\u0026gt;\n          \u0026lt;p\u0026gt;\u0026lt;span class=\u0026quot;subHead3\u0026quot;\u0026gt;Genting Malaysia\u0026amp;nbsp;\u0026lt;/span\u0026gt;\u0026lt;/p\u0026gt;\n          \u0026lt;ul\u0026gt;\n            \u0026lt;li\u0026gt;Debt maturities of close to MYR0.3 billion over the 12 months ending Sept. 30, 2026. \u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;Capex of about MYR4.6 billion over the 12 months ending Sept. 30, 2026. \u0026lt;/li\u0026gt;\n            \u0026lt;li\u0026gt;Annual dividend payments of MYR0.6 billion-MYR0.7 billion over the 12 months ending Sept. 30, 2026.\u0026lt;/li\u0026gt;\n          \u0026lt;/ul\u0026gt;\n          \u0026lt;p\u0026gt;\u0026l
